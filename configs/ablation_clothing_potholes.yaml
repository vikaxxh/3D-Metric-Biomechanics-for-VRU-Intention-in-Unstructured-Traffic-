# Configuration for Clothing Occlusion & Ego-Pitch (Pothole) Ablation
experiment_name: "ablation_clothing_potholes"
seed: 42
device: "cuda" # Automatically falls back to CPU if CUDA is unavailable

ablation_settings:
  # Test 1: Traditional Attire (Sarees/Kurtas) Lower-Limb Occlusion Sweep
  # 0.0: Full legs visible (western attire); 1.0: 100% lower-body occluded (flowing saree/dhoti)
  lower_limb_occlusion_rates: [0.0, 0.25, 0.50, 0.75, 1.0]

  # Test 2: Road Surface Roughness & Ego-Vehicle Pitch (Potholes / Speed Breakers)
  # Amplitude of pitch/vibration noise in degrees: [0 deg (smooth), 2 deg, 5 deg, 8 deg, 12 deg (severe pothole)]
  vehicle_pitch_perturbations_deg: [0.0, 2.0, 5.0, 8.0, 12.0]

evaluation:
  checkpoint_path: "checkpoints/idd_transfer_best.pt"
  idd_ped_test_dir: "data/real_data/idd_ped/test"
  output_results_json: "evaluation/results/clothing_pothole_ablation.json"
